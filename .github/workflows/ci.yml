name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job, on purpose. Runners for the Xcode 27 image can be scarce: with
  # the tests and the two builds as separate jobs, one of them was regularly
  # still waiting for a runner when GitHub gave up on it. Everything here
  # needs a runner only once.
  check:
    name: Tests and builds
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - name: Package tests
        run: swift test --package-path Packages/OpenScreensKit
      - name: Engine tests
        run: >
          swift test --package-path Vendor/rootshell-vnc
          --filter "RFBProtocolTests|RFBTransportTests|VideoSourceFrameCounterTests|FileTransferNameTests"
      - name: Build the Mac app
        run: >
          xcodebuild build
          -project OpenScreens.xcodeproj
          -scheme "OpenScreens"
          -destination "platform=macOS"
          CODE_SIGNING_ALLOWED=NO
      - name: Build the iPhone and iPad app
        run: >
          xcodebuild build
          -project OpenScreens.xcodeproj
          -scheme "OpenScreens iOS"
          -destination "generic/platform=iOS Simulator"
          CODE_SIGNING_ALLOWED=NO
