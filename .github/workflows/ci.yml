name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - name: Package tests
        run: swift test --package-path Packages/OpenScreensKit
      - name: Engine tests
        run: >
          swift test --package-path Vendor/rootshell-vnc
          --filter "RFBProtocolTests|RFBTransportTests"

  # Runners for the Xcode 27 image can be scarce. Three jobs asking for one
  # at once have left two waiting until GitHub gave up on them, so the jobs
  # take turns.
  build:
    name: Build (${{ matrix.name }})
    needs: test
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: Mac
            scheme: OpenScreens
            destination: platform=macOS
          - name: iPhone and iPad
            scheme: OpenScreens iOS
            destination: generic/platform=iOS Simulator
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - name: Build
        run: >
          xcodebuild build
          -project OpenScreens.xcodeproj
          -scheme "${{ matrix.scheme }}"
          -destination "${{ matrix.destination }}"
          CODE_SIGNING_ALLOWED=NO
