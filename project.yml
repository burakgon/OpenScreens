name: OpenScreens

options:
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  defaultConfig: Release
  developmentLanguage: en

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  OpenScreensKit:
    path: Packages/OpenScreensKit

targets:
  OpenScreens:
    type: application
    platform: macOS
    sources:
      - path: Apps/macOS
      - path: Apps/Shared
    settings:
      base:
        PRODUCT_NAME: OpenScreens
        PRODUCT_BUNDLE_IDENTIFIER: $(OPENSCREENS_BUNDLE_ID)
        INFOPLIST_FILE: Apps/macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/macOS/OpenScreens.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: OpenScreensKit
        product: OpenScreensUI
      - package: OpenScreensKit
        product: OpenScreensCore

  OpenScreens iOS:
    type: application
    platform: iOS
    sources:
      - path: Apps/iOS
      - path: Apps/Shared
    settings:
      base:
        PRODUCT_NAME: OpenScreens
        PRODUCT_BUNDLE_IDENTIFIER: $(OPENSCREENS_BUNDLE_ID)
        INFOPLIST_FILE: Apps/iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/iOS/OpenScreens.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    dependencies:
      - package: OpenScreensKit
        product: OpenScreensUI
      - package: OpenScreensKit
        product: OpenScreensCore

  # Drives the iPhone and iPad app through touches and key presses against a
  # server the tests run themselves.
  OpenScreens iOS UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Apps/iOSUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(OPENSCREENS_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: OpenScreens iOS
    dependencies:
      - target: OpenScreens iOS
      - package: OpenScreensKit
        product: RFBTestServer

schemes:
  OpenScreens:
    build:
      targets:
        OpenScreens: all
    run:
      config: Debug
    archive:
      config: Release
  OpenScreens iOS:
    build:
      targets:
        OpenScreens iOS: all
        OpenScreens iOS UITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OpenScreens iOS UITests
    archive:
      config: Release
